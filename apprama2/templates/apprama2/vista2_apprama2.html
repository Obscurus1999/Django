{% extends 'base.html' %}
{% load static %}

{% block title %}Nuevo Registro{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Registrar Nuevo Proyecto / Ítem</h2>
    <form class="custom-form">
        <div class="form-group">
            <label for="nombre">Nombre de la iniciativa:</label>
            <input type="text" id="nombre" placeholder="Ej: Implementación de API Rest">
        </div>

        <div class="form-group">
            <label for="categoria">Categoría:</label>
            <select id="categoria">
                <option value="">Seleccione una opción...</option>
                <option value="1">Desarrollo Software</option>
                <option value="2">Mantenimiento</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción detallada:</label>
            <textarea id="descripcion" rows="4" placeholder="Escriba los detalles aquí..."></textarea>
        </div>

        <button type="button" class="btn-primary">Guardar Registro</button>
    </form>
</div>
{% endblock %}
